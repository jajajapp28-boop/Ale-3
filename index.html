<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ale 🤍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo de estrellas -->
    <canvas id="stars"></canvas>

    <!-- Mensaje superior -->
    <div class="titulo">
        Para Ale 🤍
    </div>

    <!-- Contenedor principal -->
    <div id="scene">

        <!-- Esfera central -->
        <div class="sphere"></div>

        <!-- Las palabras aparecerán aquí -->
        <div id="wordContainer"></div>

    </div>

    <!-- Botón de música -->
    <div class="musicBox">

        <button id="musicBtn">
            ▶ Reproducir música
        </button>

        <audio id="music">
            <source src="song.mp3" type="audio/mpeg">
        </audio>

    </div>

    <!-- Créditos pequeños -->
    <div class="footer">
        Hecho con cariño para Ale ✨
    </div>

<script src="script.js"></script>

</body>
</html>
